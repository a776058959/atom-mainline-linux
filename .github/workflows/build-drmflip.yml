name: Build DRM Flip Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build freestanding aarch64 probe
        run: |
          set -eux
          mkdir -p out
          aarch64-linux-gnu-gcc \
            -nostdlib -static -no-pie -ffreestanding \
            -fno-builtin -fno-stack-protector \
            -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -O2 -Wall -Wextra -Werror \
            -Wl,-e,_start -Wl,--build-id=none \
            -o out/drmflip tools/drmflip.c
          file out/drmflip
          readelf -h out/drmflip
          readelf -l out/drmflip
          sha256sum out/drmflip | tee out/drmflip.sha256

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: drmflip-aarch64
          path: |
            out/drmflip
            out/drmflip.sha256
